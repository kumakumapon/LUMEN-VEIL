name: Test and publish LUMEN VEIL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check game model
        run: npm test
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Build relative-path site
        run: npm run build
      - name: Verify GitHub Pages subpath and output
        run: |
          test -f dist/index.html
          node -e 'const fs=require("node:fs");const h=fs.readFileSync("dist/index.html","utf8");if(!h.includes("/LUMEN-VEIL/assets/")||h.includes("src=\"/assets/"))process.exit(1)'
          test $(find dist/assets -type f | wc -l) -gt 5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  e2e:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and build production site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Playwright browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser playthrough
        run: |
          nohup npm run preview > /tmp/lumen-serve.log 2>&1 &
          sleep 2
          python tests/e2e.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-zero-browser-shots
          path: screenshots/
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      # Only the deploy job needs Pages API access. Keep tests independent
      # of whether GitHub Pages has been enabled for the repository yet.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
